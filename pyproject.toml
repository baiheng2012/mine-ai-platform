[project]
name = "mine-ai"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "baiheng2012", email = "ys.bai@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
mine-ai = "mine_ai:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
train = [
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "shap>=0.54.1",
]
[tool.uv]
# 本地开发时 uv sync / uv run 默认同时安装 dev 和 train 两个分组
default-groups = ["dev", "train"]

[tool.pytest.ini_options]
# 让 pytest 能 import src/ 下的模块
pythonpath = ["src"]
