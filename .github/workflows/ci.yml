# CI流水线：每次push到main分支，或提交Pull Request时自动运行
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 严格按uv.lock安装默认依赖组(dev+train)；edge组(torch等)不会安装
      - name: Install dependencies
        run: uv sync --frozen

      # 训练、生成样例、监控、测试：步骤定义在 scripts/ci_pipeline.sh，本地也用同一个脚本
      - name: Run pipeline (train, monitor, test)
        run: bash scripts/ci_pipeline.sh

      # 即使上一步失败也上传监控报告，方便排查
      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: |
            models/*_monitoring.json
            models/*_monitoring_windows.csv
            models/flotation_drift.png

      # 验证Dockerfile在干净环境里也能构建（需要上一步训练产出的两个模型文件）
      - name: Build Docker image
        run: docker build -t geohazard-api:ci .
