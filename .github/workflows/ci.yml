# CI流水线：每次push到main分支，或提交Pull Request时自动运行
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest         # GitHub提供的临时Linux虚拟机，每次都是干净环境
    steps:
      # 1. 把仓库代码拉到虚拟机上
      - uses: actions/checkout@v4

      # 2. 安装uv（官方action，带依赖缓存，加快后续运行）
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 3. 按uv.lock安装依赖；--frozen保证和你本地版本完全一致
      - name: Install dependencies
        run: uv sync --frozen

      # 4. 准备数据：data/和models/被.gitignore排除，所以仓库里没有，CI要自己下载/创建。
      #    --retry：网络偶发失败时自动重试
      - name: Download dataset
        run: |
          mkdir -p data models
          curl -fL --retry 3 -o data/seismic-bumps.zip https://archive.ics.uci.edu/static/public/266/seismic-bumps.zip
          unzip -o data/seismic-bumps.zip -d data

      # 5. 在CI里重新训练模型 → 证明训练流程可复现，不依赖你本机的models文件
      - name: Train model
        run: uv run python src/train.py

      # 6. 生成测试用的请求样例（sample.json不在仓库里，由脚本从真实数据生成）
      - name: Generate sample request
        run: uv run python scripts/sample_request.py > sample.json

      # 7. 运行测试
      - name: Run tests
        run: uv run pytest -v

      # 8. 构建Docker镜像（验证Dockerfile在干净环境里也能构建成功）
      - name: Build Docker image
        run: docker build -t geohazard-api:ci .
